[package]
name = "money-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "wasm twin of @est/money: wraps the published decimal-money crate over a JSON boundary"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
decimal-money = "1.1"
rust_decimal = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
