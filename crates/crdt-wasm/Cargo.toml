[package]
name = "crdt-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "wasm twin of @est/crdt: RGA text CRDT mirroring crdts-kit integration semantics"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
