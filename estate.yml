# web-estate registry: the record of record for the TS/SolidJS/Astro workspace.
#
# One entry per npm package and per wasm crate. `scripts/estate-audit.ts`
# verifies this file against packages/*/package.json, the crates'
# Cargo.toml versions, and the pins held by consumer apps, and fails when
# they disagree. Run it after any version bump, rename, or pin change.
#
# ## status
#
# | status  | meaning |
# |---------|---------|
# | core    | published and dogfooded: a consumer app pins it exactly |
# | support | published and active, not yet composed by an app |
# | orphan  | published but neither composed nor recently active |
# | dormant | superseded or shelved |
# | template| scaffolding whose purpose is to seed other packages |
#
# `core` is earned, not aspirational: the audit fails if a package claims
# core without an exact consumer pin.
#
# ## parity
#
# `mirrors` names the Rust crate whose wire semantics this package shares.
# Both sides must pass the golden fixtures in conformance/<suite>/cases.json.
# A normative wire rule without a fixture is draft material.

schema: 1
kind: web-estate
updated: "2026-11-01"
owner: WyattAu
npm_scope: "@est"

packages:
  flags:
    npm: "@est/flags"
    version: "0.1.0"
    area: dx
    status: support
    mirrors: "flagsd"
    notes: "Scaffolded by new-kit; replace with a real description."
    docs:
      tier: k
      specs: ["packages/flags/SPEC.md"]
      truth_table: "AGENTS.md"
      llms_txt: true
      status: draft
      last_audit: 2026-11-02

  fetchkit:
