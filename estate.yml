    pins:
      "@est/directory-data": "0.1.0"
      "@est/envelope": "0.1.0"
      "@est/errcode": "0.1.0"
      "@est/fetchkit": "0.1.0"
      "@est/search": "0.1.0"

  directory-api:
    path: "apps/directory-api"
    notes: "Cloudflare Worker serving the directory API as json-envelope responses; runs @est/search server-side over @est/directory-data. Pins the kits exactly."
    pins:
      "@est/directory-data": "0.1.0"
      "@est/envelope": "0.1.0"
      "@est/errcode": "0.1.0"
      "@est/search": "0.1.0"

crates:
  search-wasm:
    path: "crates/search-wasm"
    version: "0.1.0"
    notes: "wasm twin of the search index ABI. Optional at runtime; @est/search falls back to TS. Artifact built by scripts/build-wasm.sh."
    wrapper: "@est/search-wasm"
